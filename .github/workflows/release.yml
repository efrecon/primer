name: Release

"on":
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  amalgamate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build amalgamation
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          safe_tag="${TAG_NAME//\//-}"
          out="primer-${safe_tag}.sh"
          ./libexec/yu.sh/bin/amalgamation.sh primer > "$out"
          escaped_tag=$(printf '%s' "$TAG_NAME" | sed 's/[\/&]/\\&/g')
          sed -i "s/^PRIMER_VERSION=.*/PRIMER_VERSION=\"$escaped_tag\"/" "$out"
          chmod +x "$out"
          "$out" --help

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          safe_tag="${TAG_NAME//\//-}"
          out="primer-${safe_tag}.sh"
          gh release upload "$TAG_NAME" "$out" --clobber

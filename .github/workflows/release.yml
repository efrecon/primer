name: Release

"on":
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  amalgamate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build amalgamation
        run: |
          ./libexec/yu.sh/bin/amalgamation.sh primer > "primer-${{ github.event.release.tag_name }}.sh"
          sed -i 's/^PRIMER_VERSION=.*/PRIMER_VERSION="${{ github.event.release.tag_name }}"/' "primer-${{ github.event.release.tag_name }}.sh"
          chmod +x "primer-${{ github.event.release.tag_name }}.sh"
          "./primer-${{ github.event.release.tag_name }}.sh" --help

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "primer-${{ github.event.release.tag_name }}.sh" --clobber

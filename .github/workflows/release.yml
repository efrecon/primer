name: Release

"on":
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  amalgamate:
    runs-on: ubuntu-latest
    env:
      TAG_NAME: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Prepare release tag
        run: |
          safe_tag=$(printf '%s' "$TAG_NAME" | LC_ALL=C sed 's/[^0-9A-Za-z._+-]/-/g')
          printf 'SAFE_TAG=%s\n' "$safe_tag" >> "$GITHUB_ENV"

      - name: Build amalgamation
        run: |
          # Decide output filename.
          out="primer-${SAFE_TAG}.sh"

          # Generate amalgamation script and set version. Only the sanitised
          # tag goes into the script: the raw tag could contain $, quotes or
          # backticks, which would run in the released script.
          ./libexec/yu.sh/bin/amalgamation.sh primer > "$out"
          sed -i "s/^PRIMER_VERSION=.*/PRIMER_VERSION=\"${SAFE_TAG}\"/" "$out"
          chmod +x "$out"

          # Verify the amalgamation script, and the version it reports.
          ./"$out" --help
          ./"$out" --version | grep -qE " v${SAFE_TAG#v}$"

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          out="primer-${SAFE_TAG}.sh"
          gh release upload "$TAG_NAME" "$out" --clobber

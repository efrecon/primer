name: Test

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Run tests
        env:
          # Authenticated GitHub API calls from within the test containers,
          # to avoid anonymous rate limits.
          GITHUB_TOKEN: ${{ github.token }}
        run: ./test/run.sh -t -j 4
